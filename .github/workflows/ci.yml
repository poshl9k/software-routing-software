name: CI

# One gate, run on every push to the shared branch and on every pull request.
# The profile split does not change what a test run means yet: the profile is a
# host marker (ADR-0026) and profile-specific behaviour is covered by capability
# tests (a host without kea-dhcp4 has no DHCP phase, and so on). When a code path
# starts branching on the profile itself, this is where the second run goes.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      # --locked: the committed lockfile is the input, not a suggestion.
      - run: uv sync --locked
        working-directory: backend
      # --no-sync: the environment above is already the one under test.
      - run: uv run --no-sync pytest -q
        working-directory: backend

  frontend:
    name: frontend (typecheck, vitest, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
