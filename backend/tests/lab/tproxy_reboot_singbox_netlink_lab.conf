[Service]
# lab-32 drop-in (LAB DEVIATION, not product output).
#
# The generated unit pins RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX.
# The pinned sing-box v1.14.2 fails closed at startup with that restriction:
#   FATAL start service: create netlink socket: address family not supported by protocol
# because it opens an AF_NETLINK socket (auto_detect_interface / network
# monitoring). This drop-in relaxes exactly that one sandbox knob so the
# pinned engine can become ready. It is a lab-only override and a reported
# finding against the generated unit; the generated unit file itself is
# installed byte-for-byte and NOT modified.
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX AF_NETLINK
