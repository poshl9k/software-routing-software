# vs-master Caddy site (ADR-0035 D8): the master's public publication.
# This file is an EXAMPLE only. install-master.sh copies it to
# /opt/vs-master/caddy-master.example and never edits or reloads Caddy.
# Replace BOTH names below with the real master hostnames before merging it into
# a live Caddyfile, then run `caddy validate` and check TLS on 443.
# Names: the operator's subdomain first, the permanent <ip>.nip.io reserve second —
# losing one name never locks the operator out.
# The addresses below are RFC 5737 documentation placeholders on purpose: a stale
# or excluded IP in this template once invited publishing the wrong host.
{
	admin off
}

master.example.net, 203.0.113.10.nip.io {
	encode zstd gzip
	reverse_proxy 127.0.0.1:8440
}
