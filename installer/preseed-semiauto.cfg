# Debian 13 (trixie) SEMI-AUTOMATIC preseed for the vs-router lab image.
#
# Used only by the "Semi-automatic install (expert)" GRUB/isolinux entry
# (cmdline: priority=high, no auto=true — make-iso.sh sets both when cloning
# the entry). Strategy:
#   * priority=high keeps d-i's normal linear flow — every answer leads to
#     the next question, no main-menu detours (that is what priority=medium
#     would do, along with dragging in speech/Braille and other expert noise).
#   * Questions the operator must see carry their value plus "seen false":
#     shown with the preseeded value as the default.
#   * Everything else is preseeded and stays silent, so only the discussed
#     set is asked: language, location, keyboard, hostname, user account
#     (SSH credentials), disk layout.
# The full-auto preseed.cfg runs at priority=critical, where seen=false on
# high-priority questions is filtered out by priority — auto installs stay
# unattended with this file untouched.
d-i netcfg/choose_interface select auto

# Hostname: asked, preseeded value as the default.
d-i netcfg/get_hostname string vs-router
d-i netcfg/get_hostname seen false
d-i netcfg/get_domain string local

# User account = the SSH credentials of the box. Username asked with the
# preseeded default; passwords are deliberately NOT preseeded (d-i does not
# echo preseeded passwords into the dialog) — the operator sets them.
d-i passwd/user-fullname string vs-router admin
d-i passwd/username string vsr-admin
d-i passwd/username seen false
d-i passwd/root-login boolean false
d-i user-setup/allow-password-weak boolean true

# Firmware, clock: silent.
d-i hw-detect/load_firmware boolean true
d-i clock-setup/utc boolean true
d-i clock-setup/ntp boolean true

# Partitioning: guided whole-disk (atomic), then the operator reviews the
# generated layout and confirms writing it — choose_partition and the write
# confirmations are intentionally left unpreseeded so the standard screens
# appear ("Finish partitioning and write changes to disk").
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic

# Boot loader, package sources, package selection: silent.
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default
d-i apt-setup/use_mirror boolean true
d-i mirror/http/proxy string
d-i popularity-contest/participate boolean false
tasksel tasksel/first multiselect none
d-i pkgsel/include string openssh-server curl ca-certificates sudo git
d-i pkgsel/upgrade select none
d-i pkgsel/update-policy select none

# The bootstrap does NOT run here: d-i's chroot deadlocks pipelined apt
# downloads (http method spins at ~100% CPU, see firstboot-bootstrap.sh).
# The late_command clones the repo and enables the first-boot service; the
# bootstrap runs on the booted system and phone-homes with its real rc.
d-i preseed/late_command string in-target sh -c "echo 'vsr-admin ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/vsr; chmod 440 /etc/sudoers.d/vsr; git clone https://github.com/poshl9k/software-routing-software.git /opt/vs-router && chmod +x /opt/vs-router/backend/packaging/firstboot-bootstrap.sh && printf '%s\n' '[Unit]' 'Description=vs-router first-boot bootstrap' 'After=network.target' 'ConditionPathExists=/opt/vs-router/backend/packaging/bootstrap.sh' '[Service]' 'Type=oneshot' 'ExecStart=/opt/vs-router/backend/packaging/firstboot-bootstrap.sh' 'TimeoutStartSec=0' '[Install]' 'WantedBy=multi-user.target' > /etc/systemd/system/vs-router-bootstrap-firstboot.service && ln -sf /etc/systemd/system/vs-router-bootstrap-firstboot.service /etc/systemd/system/multi-user.target.wants/vs-router-bootstrap-firstboot.service"

d-i debian-installer/quiet boolean true
d-i debian-installer/splash boolean false
